<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | VYRA NETWORK</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
.feat{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;margin-bottom:72px}
.feat .main .ph{aspect-ratio:16/10}
.feat .side{display:grid;gap:18px}
.feat .side .post{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
.feat .side .ph{aspect-ratio:4/3;margin:0;border-radius:12px}
.feat .side h3{font-size:16px}
@media (max-width:900px){.feat{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section class="page-top">
  <div class="wrap">
    <h1 class="page">Blog<span class="grad">.</span></h1>
    <div class="tabs" id="tabs"></div>
    <div id="featWrap">
      <div class="eyebrow mono" data-i18n="featured"></div>
      <div class="feat" id="feat"></div>
    </div>
    <div class="eyebrow mono" data-i18n="latest"></div>
    <div class="grid3" id="posts"></div>
    <div class="pager" id="pager"></div>
  </div>
</section>
</main>
<script type="module" src="/assets/pages/blog.js"></script>
</body>
</html>
