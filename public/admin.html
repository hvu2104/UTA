<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị | VYRA NETWORK</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
body{padding:32px 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.kpis .card b{display:block;font-size:36px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
td .btn{margin-right:4px}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.pill.new{border-color:var(--a2);color:var(--a2)}
.scroll{overflow-x:auto}
.login{max-width:380px;margin:15vh auto}
.form .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}.form .grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>
<script type="module" src="/assets/pages/admin.js"></script>
</body>
</html>
